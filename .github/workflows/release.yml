name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.9-mg4.85). Created on the chosen branch if it does not exist yet.'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # A tag push builds the tag. A manual run builds the chosen branch and creates the tag
      # there if it is missing, so a release can be made without pushing a tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Check an existing tag points at this commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [ "$tagged" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $TAG already exists at $tagged, not at the chosen branch's $(git rev-parse HEAD). Run the workflow from the tag instead."
              exit 1
            fi
          fi
      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' mobile/build.gradle.kts | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in mobile/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Restore platform key and CarPlay identity
        env:
          PLATFORM_PK8: ${{ secrets.MG4_PLATFORM_PK8_BASE64 }}
          PLATFORM_CERT: ${{ secrets.MG4_PLATFORM_CERT_BASE64 }}
          OFFLINE_MFI: ${{ secrets.DIPLAY_OFFLINE_MFI_TGZ_BASE64 }}
        run: |
          for name in PLATFORM_PK8 PLATFORM_CERT OFFLINE_MFI; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret for $name is not set"; exit 1; fi
          done
          keys="$RUNNER_TEMP/keys"; assets="$RUNNER_TEMP/runtime-assets"
          mkdir -p "$keys" "$assets"
          echo "$PLATFORM_PK8" | base64 --decode > "$keys/platform.pk8"
          echo "$PLATFORM_CERT" | base64 --decode > "$keys/platform.x509.pem"
          echo "$OFFLINE_MFI" | base64 --decode | tar -xz -C "$assets"
          test -d "$assets/offline-mfi" || { echo "::error::Secret archive has no offline-mfi/ folder"; exit 1; }
          echo "MG4_PLATFORM_KEYS_DIR=$keys" >> "$GITHUB_ENV"
          echo "DIPLAY_AUTH_ASSETS_DIR=$assets" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v6
      - name: Build platform-signed APK
        run: ./scripts/build_mg4.sh
      - name: Remove keys and identity
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/runtime-assets"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: MG4CPlay ${{ env.VERSION }}
          files: dist/MG4CPlay-v${{ env.VERSION }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
