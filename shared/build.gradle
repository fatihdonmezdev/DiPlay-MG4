plugins {
    id 'com.android.library'
}

def prebuiltJniDir = System.getenv('DIPLAY_PREBUILT_JNI_DIR')
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 28
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        if (prebuiltJniDir == null) {
            externalNativeBuild {
                ndkBuild {
                    arguments 'APP_PLATFORM=android-28'
                }
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    if (prebuiltJniDir == null) {
        externalNativeBuild {
            ndkBuild {
                path = file('src/main/jni/Android.mk')
            }
        }
    } else {
        sourceSets.main.jniLibs.srcDir(prebuiltJniDir)
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':evhardware')
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    implementation libs.concentus
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
